<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar dashboard</title>
    <link rel="stylesheet" href="../styles/styles.css">
</head>

<body>
    <div class="main-container">
        <aside class="sidebar">
            <nav id="resource-sidenav">
                <button data-view="library">Library</button>
                <button data-view="favourites">Favourites</button>
                <button data-view="archive">Archive</button>
            </nav>
        </aside>

        <main class="main-content">
            <button id="add-resource-button" class="add-resource-button">Add resource</button>
            <dialog id="resource-form-dialog">
                <form id="add-resource">
                    <label for="resource-name">Resource name:</label>
                    <input id="resource-name" name="resource_name" type="text" />
                    <br>

                    <label for="resource-url">URL:</label>
                    <input id="resource-url" name="resource_url" type="url" />
                    <br>

                    <label for="topics">Select topic:</label>
                    <select id="topics" name="topic"></select>
                    <br>

                    <label for="resource-type">Type:</label>
                    <select id="resource-type" name="resource_type"></select>
                    <br>

                    <label for="notes">Notes:</label>
                    <textarea id="notes" name="notes"></textarea>
                    <br>

                    <button type="submit" id="submit-button">Add resource</button>
                    <button type="button" id="cancel-button">Cancel</button>
                </form>
            </dialog>
            <div id="resources-list-container"></div>
        </main>
    </div>
    <script src="../scripts/script.js"></script>

</body>

</html>
