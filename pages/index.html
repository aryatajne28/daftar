<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar dashboard</title>
    <link rel="stylesheet" href="../styles/styles.css">
</head>

<body>
    <form id="add-resource">
        <label for="resource-name">Resource name:</label>
        <input id="resource-name" name="resource_name" type="text" />
        <br>

        <label for="resource-url">URL:</label>
        <input id="resource-url" name="resource_url" type="url" />
        <br>

        <label for="topics">Select topic:</label>
        <select id="topics" name="topic"></select>
        <br>

        <label for="resource-type">Type:</label>
        <select id="resource-type" name="resource_type"></select>
        <br>

        <label for="notes">Notes:</label>
        <textarea id="notes" name="notes"></textarea>
        <br>

        <button type="submit" id="submit-button">Add resource</button>
    </form>

    <div id="resources-list-container">
        <ul id="resources-list"></ul>
    </div>

    <article class="resource-card">
